<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 1100px; margin: auto; padding: calc(var(--gap) * 2); }
  .header { margin-bottom: calc(var(--gap) * 2); }
  .header h1 { font-size: 2rem; line-height: 1.2; }
  .header p, .status { color: var(--muted); margin-top: calc(var(--gap) / 2); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin-bottom: calc(var(--gap) * 2); }
  .card { background: var(--surface); border-radius: var(--radius); padding: var(--gap); min-width: 0; }
  .card h2 { color: var(--muted); font-size: .875rem; font-weight: normal; }
  .card p { font-size: 1.75rem; font-weight: bold; overflow-wrap: anywhere; }
  .table { background: var(--surface); border-radius: var(--radius); padding: var(--gap); }
  .section-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); margin-bottom: var(--gap); flex-wrap: wrap; }
  .section-heading h2 { font-size: 1.125rem; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  caption { text-align: left; color: var(--muted); padding-bottom: calc(var(--gap) / 2); }
  td, th { padding: calc(var(--gap) / 2); text-align: left; overflow-wrap: anywhere; font-size: .875rem; border-bottom: 1px solid var(--bg); }
  th { color: var(--muted); font-weight: normal; }
  td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  button { background: var(--primary); color: var(--surface); border: 2px solid transparent; padding: calc(var(--gap) / 2) var(--gap); border-radius: var(--radius); font: inherit; cursor: pointer; min-height: 44px; }
  button:hover { border-color: var(--text); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  @media (max-width: 40rem) {
    main { padding: var(--gap); }
    .cards { grid-template-columns: 1fr; }
    .card { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
    .card p { font-size: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header class="header">
    <h1>Dashboard</h1>
    <p>Users, revenue, growth, and recent orders.</p>
  </header>
  <section class="cards" aria-label="Key metrics">
    <div class="card"><h2>Users</h2><p>1,204</p></div>
    <div class="card"><h2>Revenue</h2><p>$8,210</p></div>
    <div class="card"><h2>Growth</h2><p>+12%</p></div>
  </section>
  <section class="table" aria-labelledby="orders-heading">
    <div class="section-heading">
      <h2 id="orders-heading">Recent Orders</h2>
      <button type="button" onclick="alert('todo')">Export</button>
    </div>
    <table>
      <caption>2 recent orders</caption>
      <thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Total</th></tr></thead>
      <tbody>
        <tr><td>#1024</td><td>A. Smith</td><td>$54.00</td></tr>
        <tr><td>#1025</td><td>B. Jones</td><td>$12.50</td></tr>
      </tbody>
    </table>
    <p class="status" role="status" hidden>No data.</p>
  </section>
</main>
</body>
</html>
